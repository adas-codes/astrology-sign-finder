<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zodiac Systems Finder</title>
    <meta
      name="description"
      content="Analyze a birth date across Western, Vedic, True Sidereal, Chinese, BaZi, Tibetan, Mayan, Aztec, Native American, Celtic, Egyptian, and Burmese zodiac systems."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="page-shell">
      <div class="app-card">
        <header class="header">
          <p class="eyebrow">Astrology Atlas</p>
          <h1>Find Your Zodiac Sign</h1>
          <p class="subtitle">
            Enter your date of birth in DD/MM/YYYY format to compare your sign across 12 zodiac systems.
          </p>
        </header>

        <form id="dob-form" class="dob-form" novalidate>
          <label for="dob">Date of birth</label>
          <div class="input-row">
            <input
              type="text"
              id="dob"
              name="dob"
              placeholder="DD/MM/YYYY"
              inputmode="numeric"
              autocomplete="bday"
              aria-label="Date of birth in DD/MM/YYYY format"
              required
            />
            <button type="submit">Submit</button>
          </div>
        </form>

        <section id="results" class="results hidden" aria-live="polite">
          <div class="result-overview">
            <div>
              <p class="label">Birth date</p>
              <h2 id="birth-date-display">—</h2>
            </div>
          </div>

          <div id="result-grid" class="result-grid">
            <article class="zodiac-card western">
              <div class="card-header">
                <h3 class="system-name">Western Tropical Zodiac</h3>
                <span class="system-badge">Western</span>
              </div>
              <h4 id="western-name" class="sign-name">—</h4>
              <p id="western-date-range" class="range-line"></p>
              <p id="western-description" class="description"></p>
            </article>

            <article class="zodiac-card vedic">
              <div class="card-header">
                <h3 class="system-name">Vedic Sidereal Zodiac</h3>
                <span class="system-badge">Vedic</span>
              </div>
              <h4 id="vedic-name" class="sign-name">—</h4>
              <p id="vedic-date-range" class="range-line"></p>
              <p id="vedic-description" class="description"></p>
            </article>

            <article class="zodiac-card celtic">
              <div class="card-header">
                <h3 class="system-name">Celtic Tree Zodiac</h3>
                <span class="system-badge">Celtic</span>
              </div>
              <h4 id="pagan-name" class="sign-name">—</h4>
              <p id="pagan-date-range" class="range-line"></p>
              <p id="pagan-description" class="description"></p>
            </article>
          </div>
        </section>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
